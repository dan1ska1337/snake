<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Doodle Jump: Вася</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#0b1020;color:#fff;font:16px system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;justify-content:center}canvas{display:block}
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px) + 8px) 16px 0;font:800 22px system-ui;text-shadow:0 2px 6px #0008;pointer-events:none}
#hud div{display:flex;gap:10px;align-items:center}#bp{display:none;pointer-events:auto;width:42px;height:42px;border-radius:12px;border:0;background:#ffffff30;color:#fff;font-size:18px}
#ctl{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:center;gap:16px;padding:0 14px calc(var(--tg-safe-area-inset-bottom,0px) + env(safe-area-inset-bottom,0px) + 16px)}
#ctl button{width:84px;height:84px;border-radius:50%;background:#ffffff26;color:#fff;font-size:34px;border:2px solid #ffffff55}
#ctl button:active{background:#ffffff66}#bf{background:#ff7043aa!important}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;text-align:center;padding:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px) + 24px) 20px 24px;background:#0a1030f2;overflow-y:auto}
.ov.on{display:flex}.ov>:first-child{margin-top:auto}.ov>:last-child{margin-bottom:auto}
h1{font-size:38px;margin:0;background:linear-gradient(90deg,#9ccc65,#ffe066,#4dabf7);-webkit-background-clip:text;color:transparent}h2{font-size:30px;margin:0}p{margin:0;opacity:.85;line-height:1.5}
.btn{width:100%;max-width:320px;padding:14px;border:0;border-radius:16px;background:#2a3566;color:#fff;font:700 16px system-ui}.btn:active{transform:scale(.96)}
.btn.p{background:linear-gradient(135deg,#7bd957,#2fa84f);box-shadow:0 6px 20px #4caf5066;font-size:20px;padding:17px}
.row{display:flex;gap:8px;width:100%;max-width:320px}.row .btn{padding:12px;font-size:14px}
.card{width:100%;max-width:320px;background:#2a3566;border-radius:16px;padding:16px;line-height:1.9;text-align:left}
.sk{display:flex;align-items:center;gap:12px;text-align:left}.sk span{font-size:28px}.sk small{display:block;font-weight:400;opacity:.75}.sk.sel{outline:2px solid #ffe066}
#err{position:fixed;left:8px;right:8px;top:70px;background:#b71c1cdd;padding:8px;border-radius:8px;font:12px monospace;display:none;z-index:9}
</style></head><body>
<div id="app"><canvas id="cv"></canvas></div>
<div id="hud"><span id="sc">0</span><div><span id="cn"></span><button id="bp">⏸</button></div></div>
<div id="ctl"><button id="bl">◀</button><button id="bf">🐾</button><button id="br">▶</button></div>
<div id="menu" class="ov on"><h1>🐱 Вася прыгает</h1>
<p>Допрыгай до космоса! Управление: <b>наклон телефона</b> или кнопки ◀ ▶.<br>🐾 — Вася зевает и стреляет шерстью. Собирай 🪙 и 🚀.</p><p id="mb"></p>
<button class="btn p" id="play">▶️ Играть</button>
<div class="row"><button class="btn" id="b-sk">🎨 Скины</button><button class="btn" id="b-st">📊 Статистика</button></div>
<div class="row"><button class="btn" id="b-tilt"></button><button class="btn" id="b-inv"></button></div>
<button class="btn" id="b-dev">✉️ Написать разработчику</button></div>
<div id="skins" class="ov"><h2>🎨 Скины Васи</h2><p id="cc"></p><div id="skl" style="display:contents"></div><button class="btn back">⬅️ Назад</button></div>
<div id="stats" class="ov"><h2>📊 Статистика</h2><div class="card" id="stl"></div><button class="btn back">⬅️ Назад</button></div>
<div id="pause" class="ov"><h2>⏸ Пауза</h2><button class="btn p" id="resume">▶️ Продолжить</button><button class="btn" id="redo">🔄 Заново</button><button class="btn" id="exit">🏠 В меню</button></div>
<div id="over" class="ov"><h2>Вася упал 💥</h2><h1 id="os">0</h1><p id="ob" style="white-space:pre-line"></p><button class="btn p" id="again">🔄 Ещё раз</button><button class="btn" id="omenu">🏠 В меню</button></div>
<div id="err"></div>
<script>
const $=id=>document.getElementById(id),tg=window.Telegram&&Telegram.WebApp,KEY='doodle_v3',VW=360,FY=30,DEV='dan1ska_qwe';
let S={best:0,games:0,kT:0,kS:0,shots:0,coins:0,coinsAll:0,meters:0,time:0,tilt:true,inv:false,skin:'gray',own:['gray']},st='menu',sc=1,VH=640,dpr=1,t0=0;
const cv=$('cv'),ctx=cv.getContext('2d'),IMG=new Image();IMG.src='temchik.jpg';
const SK={gray:{n:'Вася',i:'🐱',b:'#74777c',l:'#c9c6c0',s:'#55585d',e:'#d7d06a',p:0},
orange:{n:'Рыжик',i:'🧡',b:'#e08a3c',l:'#f6d7a8',s:'#b8661f',e:'#7bd957',p:80},
black:{n:'Тень',i:'🖤',b:'#30323a',l:'#585b66',s:'#1b1c20',e:'#ffd43b',p:150},
space:{n:'Космо-Вася',i:'🚀',b:'#7c8cf0',l:'#d6dcff',s:'#5565d4',e:'#7ef0ff',p:260,a:'helmet'},
gold:{n:'Золотой Вася',i:'👑',b:'#f2b925',l:'#fff1b0',s:'#c98f0a',e:'#fff',p:400,a:'crown'}};
window.onerror=(m,s,l)=>{const e=$('err');e.style.display='block';e.textContent='Ошибка: '+m+' (стр. '+l+')'};
const hap=t=>{try{t==='error'?tg.HapticFeedback.notificationOccurred('error'):tg.HapticFeedback.impactOccurred(t)}catch(e){}};
let AC;const beep=(f,d=.09,t='square')=>{try{AC=AC||new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),v=AC.createGain();o.type=t;o.frequency.value=f;v.gain.value=.05;o.connect(v);v.connect(AC.destination);o.start();v.gain.exponentialRampToValueAtTime(1e-4,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}};
function load(cb){let done=false;const fin=v=>{if(done)return;done=true;try{Object.assign(S,JSON.parse(v||localStorage.getItem(KEY)||'{}'))}catch(e){}cb()};
 try{if(tg&&tg.isVersionAtLeast('6.9')){tg.CloudStorage.getItem(KEY,(e,v)=>fin(v));setTimeout(()=>fin(),1500);return}}catch(e){}fin()}
function save(){const j=JSON.stringify(S);try{localStorage.setItem(KEY,j)}catch(e){}try{if(tg&&tg.isVersionAtLeast('6.9'))tg.CloudStorage.setItem(KEY,j)}catch(e){}}
const show=id=>['menu','skins','stats','pause','over'].forEach(k=>$(k).classList.toggle('on',k===id));
const ctlShow=v=>{$('ctl').style.display=v?'flex':'none';$('bp').style.display=v?'block':'none'};
function ui(){$('mb').textContent=`🏆 Рекорд: ${S.best}   🪙 ${S.coins}`;$('cn').textContent='🪙 '+S.coins;
 $('b-tilt').textContent='📱 Наклон: '+(S.tilt?'вкл':'выкл');$('b-inv').textContent='🔄 Инверсия: '+(S.inv?'да':'нет');
 $('stl').innerHTML=`🎮 Игр: <b>${S.games}</b><br>🏆 Рекорд: <b>${S.best}</b><br>📏 Всего высоты: <b>${S.meters} м</b><br>🪙 Монет собрано: <b>${S.coinsAll}</b><br>🐗 Тёмный Тёмчик побеждён: <b>${S.kT}</b><br>🧙 Solfedo побеждён: <b>${S.kS}</b><br>🐾 Выстрелов: <b>${S.shots}</b><br>🎨 Скинов: <b>${S.own.length}/${Object.keys(SK).length}</b><br>⏱ Время в игре: <b>${Math.floor(S.time/60)} мин</b>`}
function renderSkins(){const box=$('skl');box.innerHTML='';$('cc').textContent='🪙 '+S.coins;
 for(const id in SK){const k=SK[id],has=S.own.includes(id),b=document.createElement('button');b.className='btn sk'+(S.skin===id?' sel':'');
  b.innerHTML=`<span>${k.i}</span><div><b>${k.n}</b><small>${S.skin===id?'Выбран ✅':has?'Нажми, чтобы выбрать':'🪙 '+k.p}</small></div>`;
  b.onclick=()=>{if(!has){if(S.coins<k.p){beep(150,.2);return alert(`Не хватает монет: нужно ${k.p} 🪙`)}S.coins-=k.p;S.own.push(id)}S.skin=id;save();ui();renderSkins();beep(880)};box.appendChild(b)}}

/* ---- ввод ---- */
let Lf=0,Rf=0,Ff=0,tiltN=0,tiltS=0,tOn=false,cd=0,yawn=0;
const clp=v=>Math.max(-1,Math.min(1,v)),dz=v=>Math.abs(v)<.12?0:v;
const hold=(id,on,off)=>{const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();on()});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,off))};
hold('bl',()=>Lf=1,()=>Lf=0);hold('br',()=>Rf=1,()=>Rf=0);hold('bf',()=>{Ff=1;shoot()},()=>Ff=0);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')Lf=1;if(e.key==='ArrowRight'||e.key==='d')Rf=1;if(e.key===' '){Ff=1;shoot()}if(e.key==='Escape')pauseGame()});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')Lf=0;if(e.key==='ArrowRight'||e.key==='d')Rf=0;if(e.key===' ')Ff=0});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});
function startTilt(){if(!S.tilt||tOn)return;tOn=true;
 const DO=()=>{try{DeviceOrientationEvent.requestPermission&&DeviceOrientationEvent.requestPermission()}catch(e){}addEventListener('deviceorientation',e=>{tiltN=dz(clp((e.gamma||0)/25))})};
 try{if(tg&&tg.Accelerometer&&tg.isVersionAtLeast('8.0')){tg.onEvent('accelerometerChanged',()=>{tiltN=dz(clp(-tg.Accelerometer.x/4))});tg.onEvent('accelerometerFailed',DO);tg.Accelerometer.start({refresh_rate:20});return}}catch(e){}DO()}

/* ---- мир ---- */
const G=1400,JV=-700,SV=-1120,MV=330;let p,pl,en,bl,eb,parts=[],cam,topY,hs,bonus,kills,score,genY,lastEn,boost,runC;
const gap=()=>55+Math.min(70,hs/30)+Math.random()*20;
function add(y){const w=64,t=hs>250&&Math.random()<.22?'m':'n',s=t==='n'&&Math.random()<.07,f=t==='n'&&!s;
 pl.push({x:Math.random()*(VW-w),y,w,t,s,c:f&&Math.random()<.22,r:f&&hs>200&&Math.random()<.035,v:(Math.random()<.5?-1:1)*(50+Math.random()*40)});
 if(hs>150&&Math.random()<.22)pl.push({x:Math.random()*(VW-w),y:y-25-Math.random()*20,w,t:'b'})}
function fill(){while(genY>cam-120){genY-=gap();add(genY);
 if(hs>=500&&lastEn-genY>560&&Math.random()<.35){lastEn=genY;const k=hs>1200&&Math.random()<.5?'S':'T',h=k==='T'?3:5;
  en.push({k,x:60+Math.random()*(VW-120),y:genY-80,y0:genY-80,vx:k==='T'?(Math.random()<.5?-1:1)*50:0,hp:h,mh:h,t:0,cd:1.5})}}}
function init(){p={x:VW/2,y:VH-100,vx:0,vy:JV,f:1};pl=[{x:VW/2-50,y:VH-60,w:100,t:'n'}];en=[];bl=[];eb=[];parts=[];cam=0;topY=p.y;hs=0;bonus=0;kills=0;score=0;genY=VH-60;lastEn=genY;cd=0;yawn=0;boost=0;runC=0;tiltS=0;fill();$('sc').textContent=0}
function burst(x,y,c){for(let i=0;i<7;i++)parts.push({x,y,vx:(Math.random()-.5)*200,vy:-Math.random()*140,l:1,c})}
function shoot(){if(st!=='play'||cd>0)return;cd=.32;yawn=.28;S.shots++;bl.push({x:p.x+p.f*8,y:p.y-24,vx:p.vx*.3,vy:-950,l:1.1});beep(300,.08,'triangle');hap('light')}
function kill(e){e.hp=0;const c=e.k==='T'?3:6;bonus+=e.k==='T'?60:120;kills++;e.k==='T'?S.kT++:S.kS++;S.coins+=c;S.coinsAll+=c;runC+=c;$('cn').textContent='🪙 '+S.coins;burst(e.x,e.y,'#ffd43b');burst(e.x,e.y,'#fff');beep(700,.15,'triangle');hap('medium')}
function upd(dt){cd-=dt;yawn-=dt;if(Ff&&cd<=0)shoot();
 tiltS+=(tiltN-tiltS)*Math.min(1,dt*10);const ax=clp(Rf-Lf+(S.tilt?(S.inv?-1:1)*tiltS:0));
 p.vx+=(ax*MV-p.vx)*Math.min(1,dt*12);p.x+=p.vx*dt;if(p.x<-16)p.x=VW+16;if(p.x>VW+16)p.x=-16;if(ax)p.f=ax>0?1:-1;
 const pf=p.y+FY;if(boost>0){boost-=dt;p.vy=-880}else p.vy+=G*dt;p.y+=p.vy*dt;const fy=p.y+FY;
 if(p.vy>0)for(const q of pl){if(q.dead)continue;
  if(pf<=q.y+4&&fy>=q.y&&p.x>q.x-8&&p.x<q.x+q.w+8){
   if(q.t==='b'){q.dead=true;beep(150,.15);burst(q.x+q.w/2,q.y,'#a1887f');continue}
   p.vy=q.s?SV:JV;beep(q.s?880:520,.08,'sine');hap(q.s?'medium':'light');burst(p.x,q.y,'#ffffffcc');break}}
 for(const q of pl){if(q.dead)continue;const cx=q.x+q.w/2;
  if(q.c&&Math.abs(p.x-cx)<26&&Math.abs(p.y-(q.y-26))<34){q.c=0;S.coins++;S.coinsAll++;runC++;$('cn').textContent='🪙 '+S.coins;beep(1040,.07,'triangle');hap('light')}
  if(q.r&&Math.abs(p.x-cx)<26&&Math.abs(p.y-(q.y-30))<36){q.r=0;boost=2.2;beep(180,.4,'sawtooth');hap('medium')}}
 for(const q of pl){if(q.t==='m'){q.x+=q.v*dt;if(q.x<0||q.x>VW-q.w)q.v*=-1}if(q.dead)q.y+=500*dt}
 for(const e of en){if(e.hp<=0)continue;e.t+=dt;
  if(e.k==='T'){e.x+=e.vx*dt;if(e.x<40||e.x>VW-40)e.vx*=-1;e.y=e.y0+Math.sin(e.t*2)*8}
  else{e.x=VW/2+Math.sin(e.t*1.2)*(VW/2-36);e.y=e.y0+Math.sin(e.t*2.4)*20;e.cd-=dt;if(e.cd<=0&&e.y>cam+20){e.cd=2.4;eb.push({x:e.x,y:e.y+34,vy:240})}}
  if(Math.abs(p.x-e.x)<30&&Math.abs(p.y-e.y)<40){if(boost>0){kill(e)}else if(p.vy>0&&p.y<e.y-6){kill(e);p.vy=JV*1.05}else return over()}}
 for(const o of eb){o.y+=o.vy*dt;if(boost<=0&&Math.abs(p.x-o.x)<15&&Math.abs(p.y-o.y)<24)return over()}
 for(const b of bl){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;for(const e of en){if(e.hp>0&&Math.abs(b.x-e.x)<28&&Math.abs(b.y-e.y)<36){e.hp--;b.l=0;burst(b.x,b.y,'#ff5252');beep(240,.06,'sawtooth');if(e.hp<=0)kill(e);break}}}
 bl=bl.filter(b=>b.l>0);eb=eb.filter(o=>o.y<cam+VH+60);en=en.filter(e=>e.hp>0&&e.y<cam+VH+120);
 if(p.y<topY)topY=p.y;const nc=p.y-VH*.42;if(nc<cam)cam=nc;
 hs=Math.max(hs,Math.floor((VH-100-topY)/10));const s=hs+bonus;if(s!==score){score=s;$('sc').textContent=s}
 fill();pl=pl.filter(q=>q.y<cam+VH+80);
 for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=600*dt;q.l-=dt*2}parts=parts.filter(q=>q.l>0);
 if(p.y>cam+VH+60)over()}
function bank(){S.games++;const rec=score>S.best;if(rec)S.best=score;const bc=Math.floor(score/150);S.coins+=bc;S.coinsAll+=bc;S.meters+=Math.round(hs/10);S.time+=Math.round((performance.now()-t0)/1000);save();ui();return{rec,bc}}
function over(){if(st!=='play')return;st='over';ctlShow(false);const r=bank();beep(110,.5,'sawtooth');hap('error');
 $('os').textContent=score;$('ob').textContent=(r.rec&&score?'⭐ Новый рекорд!':'Рекорд: '+S.best)+`\n🪙 +${runC+r.bc}   ☠ Злодеев: ${kills}`;show('over')}
function begin(){init();st='play';t0=performance.now();show(null);ctlShow(true);startTilt();beep(1,.01)}
function pauseGame(){if(st!=='play')return;st='pause';ctlShow(false);Lf=Rf=Ff=0;show('pause')}
function toMenu(){if(st==='pause')bank();st='menu';ctlShow(false);init();ui();show('menu')}
$('play').onclick=$('again').onclick=$('redo').onclick=()=>{if(st==='pause')bank();begin()};
$('resume').onclick=()=>{st='play';show(null);ctlShow(true)};$('bp').onclick=pauseGame;$('exit').onclick=$('omenu').onclick=toMenu;
$('b-sk').onclick=()=>{renderSkins();show('skins')};$('b-st').onclick=()=>{ui();show('stats')};document.querySelectorAll('.back').forEach(b=>b.onclick=()=>show('menu'));
$('b-tilt').onclick=()=>{S.tilt=!S.tilt;save();ui()};$('b-inv').onclick=()=>{S.inv=!S.inv;save();ui()};
$('b-dev').onclick=()=>{const u=`https://t.me/${DEV}?text=${encodeURIComponent('Здравствуйте!')}`;tg&&tg.openTelegramLink?tg.openTelegramLink(u):window.open(u)};

/* ---- графика ---- */
const rr=(x,y,w,h,r)=>{ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)};
const el=(x,y,a,b,c,o)=>{ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,a,b,0,0,7);ctx.fill();if(o){ctx.strokeStyle='#1d1f24';ctx.lineWidth=2;ctx.stroke()}};
function plat(q,now){const{x,y,w}=q;ctx.fillStyle='#0003';rr(x+3,y+13,w-6,6,3);ctx.fill();
 if(q.t==='b'){ctx.fillStyle='#a1887f';rr(x,y,w,14,5);ctx.fill();ctx.fillStyle='#8d6e63';ctx.fillRect(x+w*.2,y+3,w*.25,2);ctx.fillRect(x+w*.55,y+8,w*.25,2);ctx.strokeStyle='#4e342e';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+w*.4,y);ctx.lineTo(x+w*.48,y+7);ctx.lineTo(x+w*.42,y+14);ctx.stroke();return}
 ctx.fillStyle=q.t==='m'?'#2f6fd0':'#7a5230';rr(x,y+4,w,12,5);ctx.fill();ctx.fillStyle=q.t==='m'?'#8fd0ff':'#7bd957';rr(x,y,w,8,4);ctx.fill();
 if(q.t==='m'){ctx.fillStyle='#ffe066';for(let i=1;i<4;i++){ctx.beginPath();ctx.arc(x+w*i/4,y+11,2,0,7);ctx.fill()}}
 else{ctx.fillStyle='#4fae33';for(let i=6;i<w-4;i+=11)ctx.fillRect(x+i,y-2,2,4);if((x|0)%5===0){el(x+w*.8,y-2,3,3,'#ff80ab');el(x+w*.8,y-2,1.2,1.2,'#fff59d')}}
 if(q.s){const sx=x+w/2;ctx.strokeStyle='#e53935';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(sx-8,y);for(let i=0;i<4;i++)ctx.lineTo(sx+(i%2?8:-8),y-3-i*4);ctx.stroke();el(sx,y-17,9,3.5,'#ffd43b',1)}
 if(q.c){const sx=Math.abs(Math.cos(now/220))*9+1;ctx.shadowColor='#ffd43b';ctx.shadowBlur=10;el(q.x+q.w/2,y-26,sx,9,'#ffd43b',1);ctx.shadowBlur=0}
 if(q.r){ctx.font='24px serif';ctx.textAlign='center';ctx.fillText('🚀',q.x+q.w/2,y-18+Math.sin(now/200)*3)}}
function cat(){const K=SK[S.skin],yw=yawn>0,l=p.vy<0?3:10;ctx.save();ctx.scale(p.f,1);ctx.lineCap='round';ctx.lineJoin='round';
 if(boost>0){ctx.fillStyle='#cfd8dc';rr(-25,-4,11,30,4);ctx.fill();ctx.fillStyle='#e53935';rr(-25,-8,11,8,4);ctx.fill();ctx.fillStyle='#ff9100';ctx.beginPath();ctx.moveTo(-23,26);ctx.lineTo(-19,56+Math.random()*14);ctx.lineTo(-16,26);ctx.fill();ctx.fillStyle='#ffe066';ctx.beginPath();ctx.moveTo(-21,26);ctx.lineTo(-19,46+Math.random()*6);ctx.lineTo(-17,26);ctx.fill()}
