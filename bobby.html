function fullE(){if(S.fday!==day()){S.fday=day();S.full=3}if(S.full<=0)return say('Сегодня бесплатные заряды закончились');S.full--;S.e=ME();save();beep(700,.2,'sine');toast('⚡ Энергия полностью восстановлена');panel()}
function skin(i){if(!S.own.includes(i)){if(S.c<SKINS[i][2]){beep(140,.15,'sawtooth');return say('Не хватает монет: нужно '+fmt(SKINS[i][2])+' 🪙')}S.c-=SKINS[i][2];S.own.push(i)}S.skin=i;save();beep(880,.15,'sine');panel()}
const TASKS=[['snake','🐍','Сыграть в Змейку',5000,()=>location.href='index.html?v=7'],['doodle','🐱','Сыграть в Doodle Jump',5000,()=>location.href='doodle.html?v=5'],['dev','✉️','Написать разработчику',2000,()=>{const u=`https://t.me/${DEV}?text=${encodeURIComponent('Здравствуйте!')}`;tg&&tg.openTelegramLink?tg.openTelegramLink(u):window.open(u)}],['taps','👆','Сделать 10 000 тапов',20000,null]];
const DR=[500,1000,2000,4000,8000,16000,32000];
function claimDaily(){if(S.day===day())return;const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak=S.day===y?Math.min(S.streak+1,7):1;S.day=day();const r=DR[S.streak-1];S.c+=r;S.tot+=r;save();confetti();toast('🎁 День '+S.streak+': +'+fmt(r)+' 🪙');chkLv();panel()}
function task(i){const t=TASKS[i];if(S.tasks.includes(t[0]))return;if(t[0]==='taps'&&S.taps<10000)return say('Сделано тапов: '+S.taps+' из 10 000');S.tasks.push(t[0]);S.c+=t[3];S.tot+=t[3];save();toast('✅ +'+fmt(t[3])+' 🪙');chkLv();panel();if(t[4])setTimeout(t[4],500)}
const row=(ic,n,d,btn,sel)=>`<div class="it${sel?' sel':''}"><span class="ic">${ic}</span><div><b>${n}</b><small>${d}</small></div>${btn}</div>`;
function panel(){const p=$('pn');p.classList.toggle('on',tab!=='play');document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===tab));let h='';
 if(tab==='boost'){h='<h2>🚀 Бусты</h2>';const U=[['mt','👆','Мультитап',`+1 за тап · сейчас +${P()}`],['eg','🔋','Запас энергии',`+500 · сейчас ${ME()}`],['rc','⚡','Скорость восстановления',`+1/с · сейчас ${RG()}/с`],['bot','🤖','Бот Боби (пассивный доход)',`+2 монеты/с · сейчас ${BR()}/с · до 3 ч офлайн`]];
  h+=U.map(([k,ic,n,d])=>row(ic,n,d+` · ур. ${S[k]}`,S[k]>=MAXL[k]?'<button class="b g" disabled>МАКС</button>':`<button class="b" onclick="buy('${k}')">🪙 ${fmt(COST[k](S[k]))}</button>`)).join('');
  if(S.fday!==day()){S.fday=day();S.full=3}h+=row('🔥','Полная энергия',`осталось сегодня: ${S.full}/3`,`<button class="b" onclick="fullE()">Заряд</button>`)}
 if(tab==='skins'){h='<h2>🎩 Образы Боби</h2><p style="margin:0;opacity:.8">🪙 '+fmt(S.c)+'</p>'+SKINS.map((s,i)=>row(s[1],s[0],S.skin===i?'Выбран ✅':S.own.includes(i)?'Нажми, чтобы выбрать':'🪙 '+fmt(s[2]),`<button class="b${S.own.includes(i)?' g':''}" onclick="skin(${i})">${S.skin===i?'Надет':S.own.includes(i)?'Надеть':'Купить'}</button>`,S.skin===i)).join('')}
 if(tab==='tasks'){const av=S.day!==day();h='<h2>📋 Задания</h2>'+row('🎁','Ежедневная награда',av?`день ${Math.min((S.day===new Date(Date.now()-864e5).toISOString().slice(0,10)?S.streak:0)+1,7)}: +${fmt(DR[Math.min((S.day===new Date(Date.now()-864e5).toISOString().slice(0,10)?S.streak:0),6)])} 🪙`:'Уже получена, приходи завтра',av?'<button class="b" onclick="claimDaily()">Забрать</button>':'<button class="b g" disabled>✓</button>')+TASKS.map((t,i)=>row(t[1],t[2],'+'+fmt(t[3])+' 🪙'+(t[0]==='taps'?` · ${Math.min(S.taps,10000)}/10 000`:''),S.tasks.includes(t[0])?'<button class="b g" disabled>✓</button>':`<button class="b" onclick="task(${i})">${t[4]?'Перейти':'Забрать'}</button>`)).join('')}
 if(tab==='stats'){h='<h2>🏴‍☠️ Боб aka Боби Боливия</h2>'+LV.map((l,i)=>row(i<=lvi()?'✅':'🔒',l[0],'от '+fmt(l[2])+' 🪙','',i===lvi())).join('')+`<div class="it"><div>👆 Тапов: <b style="display:inline">${S.taps}</b><br>💰 Всего заработано: <b style="display:inline">${fmt(S.tot)}</b><br>🎩 Образов: <b style="display:inline">${S.own.length}/${SKINS.length}</b><br>⏱ В игре: <b style="display:inline">${Math.floor(S.time/60)} мин</b></div></div><div class="it"><div>Звук</div><button class="b g" onclick="S.snd=!S.snd;save();panel()">${S.snd?'🔊 вкл':'🔇 выкл'}</button><button class="b g" onclick="S.vib=!S.vib;save();panel()">${S.vib?'📳 вкл':'📴 выкл'}</button></div><div class="it"><div>Другие игры</div><button class="b" onclick="location.href='games.html?v=1'">🎮 Открыть</button></div>`}
 p.innerHTML=h}
$('tabs').innerHTML=[['play','🏴‍☠️','Игра'],['boost','🚀','Бусты'],['skins','🎩','Образы'],['tasks','📋','Задания']].map(t=>`<button data-k="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('');
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.k;panel()});$('lv').onclick=()=>{tab=tab==='stats'?'play':'stats';panel()};

let last=0,acc=0;function loop(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;sq=Math.max(0,sq-dt*5);mouth=Math.max(0,mouth-dt);
 const m=ME();S.e=Math.min(m,S.e+RG()*dt);if(S.bot){const g=BR()*dt;S.c+=g;S.tot+=g;acc+=dt;if(acc>1){acc=0;chkLv();dirty=true}}S.time+=dt/1;hud();draw(now,dt);requestAnimationFrame(loop)}
addEventListener('resize',()=>setTimeout(resize,50));
if(tg){tg.ready();tg.expand();try{tg.disableVerticalSwipes()}catch(e){}try{if(/android|ios/.test(tg.platform)&&tg.isVersionAtLeast('8.0'))tg.requestFullscreen()}catch(e){}try{tg.setHeaderColor('#06142e');tg.setBackgroundColor('#06142e')}catch(e){}
 ['viewportChanged','safeAreaChanged','contentSafeAreaChanged','fullscreenChanged'].forEach(ev=>{try{tg.onEvent(ev,()=>setTimeout(resize,80))}catch(e){}})}
resize();panel();requestAnimationFrame(loop);setTimeout(()=>$('splash').classList.add('off'),4000);
load(()=>{const dt=Math.max(0,(Date.now()-S.seen)/1000);S.e=Math.min(ME(),S.e+RG()*dt);const off=Math.min(dt,10800)*BR();if(off>5){S.c+=off;S.tot+=off;setTimeout(()=>toast('🤖 Пока тебя не было, Боби заработал '+fmt(off)+' 🪙'),1400)}li=lvi();S.seen=Date.now();
 if(S.day!==day())setTimeout(()=>toast('🎁 Доступна ежедневная награда!'),off>5?4200:1400);if(new URLSearchParams(location.search).get('go')==='stats'){tab='stats';panel()}
 setTimeout(()=>$('splash').classList.add('off'),Math.max(150,1100-performance.now()))});
</script></body></html>
