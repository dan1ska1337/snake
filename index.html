<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Змейка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#0d1a14;color:#fff;font:16px system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:11px;
padding:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px) + 12px) 14px calc(var(--tg-safe-area-inset-bottom,0px) + env(safe-area-inset-bottom,0px) + 14px);
background:radial-gradient(circle at 50% 0,#1f5a3a,#0d1a14 72%);overflow-y:auto}
.screen.on{display:flex}
h1{font-size:44px;margin:0;background:linear-gradient(90deg,#ffe066,#7bed9f,#ff9ff3);-webkit-background-clip:text;color:transparent;animation:fl 3s infinite alternate}
@keyframes fl{to{transform:scale(1.06) rotate(-2deg)}}h2{margin:0}p{margin:0;opacity:.85}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.chips span{background:#ffffff18;padding:6px 12px;border-radius:20px;font-weight:700}
.btn{width:100%;max-width:340px;padding:15px;border:0;border-radius:16px;background:#26493a;color:#fff;font:600 17px system-ui;transition:transform .1s}
.btn:active{transform:scale(.96)}.btn.p{background:linear-gradient(135deg,#34c759,#1faa59);box-shadow:0 6px 20px #34c75955}
.row{display:flex;gap:8px;width:100%;max-width:340px}.row .btn{padding:11px;font-size:14px}
.skin{display:flex;flex-direction:column;gap:2px;align-items:center;padding:10px}.skin span{font-size:28px}.skin small{opacity:.75;font-weight:400}.skin.sel{outline:2px solid #ffe066}
.card{width:100%;max-width:340px;background:#26493a;border-radius:16px;padding:16px;line-height:1.75;font-size:16px}
.hud{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;font:700 18px system-ui}
.hud button{width:40px;height:40px;border:0;border-radius:12px;background:#26493a;color:#fff;font-size:18px}
#wrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
#hint{position:absolute;pointer-events:none;background:#000b;padding:10px 16px;border-radius:12px;animation:pl 1.2s infinite alternate}
@keyframes pl{to{opacity:.4}}
.pad{display:grid;grid-template-areas:". u ." "l d r";gap:10px;width:250px}
.pad button{height:68px;border:0;border-radius:16px;background:#26493a;color:#fff;font-size:26px}
.pad button:active{background:#3d7a5c}.u{grid-area:u}.l{grid-area:l}.d{grid-area:d}.r{grid-area:r}
#ov{position:absolute;inset:0;background:#07120cee;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
#ov.on{display:flex}#ov h2{font-size:38px}#od{white-space:pre-line;font-size:19px;line-height:1.6}#obt{display:flex;flex-direction:column;gap:10px;width:100%;align-items:center}
#toast{position:fixed;top:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px) + 12px);left:50%;transform:translate(-50%,-200%);background:#ffd43b;color:#222;font-weight:800;padding:10px 18px;border-radius:14px;z-index:9;transition:.3s;pointer-events:none;max-width:90%;text-align:center}#toast.on{transform:translate(-50%,0)}
#err{position:fixed;left:8px;right:8px;top:70px;background:#b71c1cdd;padding:8px;border-radius:8px;font:12px monospace;display:none;z-index:99}

.screen.on,.ov.on{animation:inn .35s ease both}
@keyframes inn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.btn{border:1px solid #ffffff24!important;box-shadow:0 4px 14px #0005,inset 0 1px 0 #ffffff26;letter-spacing:.2px;backdrop-filter:blur(8px)}
.card{border:1px solid #ffffff22;box-shadow:0 8px 24px #0005}h1,h2{text-shadow:0 4px 22px #0008}
#splash{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s}#splash.off{opacity:0;pointer-events:none}
#splash i{font-style:normal;font-size:88px;animation:bob 1.1s ease-in-out infinite alternate;filter:drop-shadow(0 10px 18px #0007)}#splash b{font-size:26px;letter-spacing:4px}
#splash em{width:150px;height:6px;border-radius:3px;background:#ffffff26;overflow:hidden;position:relative}#splash em:after{content:'';position:absolute;top:0;bottom:0;left:0;width:45%;border-radius:3px;background:#fff;animation:ld .9s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-14px) rotate(-7deg)}}@keyframes ld{to{transform:translateX(120%)}}@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
</style></head><body><div id="splash" style="background:radial-gradient(circle at 50% 30%,#1f5a3a,#07120c)"><i>🐍</i><b>ЗМЕЙКА</b><em></em></div><div id="err"></div><div id="toast"></div>

<div id="menu" class="screen on"><h1>🐍 Змейка</h1><small style="opacity:.5;margin-top:-8px">версия 5</small><p id="hi"></p><div class="chips" id="ch"></div>
<button class="btn p" id="b-play">▶️ Играть</button>
<div class="row"><button class="btn" data-go="skins">🎨 Скины</button><button class="btn" data-go="stats">📊 Статистика</button></div>
<button class="btn" data-go="ach">🏅 Достижения</button>
<button class="btn" data-go="cfg">🗺 Карта и правила</button>
<button class="btn" id="b-spd"></button>
<div class="row"><button class="btn" id="b-snd"></button><button class="btn" id="b-vib"></button></div>
<button class="btn" id="b-bug">✉️ Написать разработчику</button></div>

<div id="skins" class="screen"><h2>🎨 Скины</h2><div class="chips"><span id="cc"></span></div><div id="skl" style="display:contents"></div><button class="btn" data-go="menu">⬅️ Назад</button></div>
<div id="cfg" class="screen"><h2>🗺 Карта и правила</h2><div class="card"><div>↔️ Ширина: <b id="vw"></b><input id="iw" type="range" min="5" max="20" style="width:100%"></div><div>↕️ Высота: <b id="vh"></b><input id="ih" type="range" min="5" max="20" style="width:100%"></div></div><p style="margin:0"><small>🎨 Тема карты</small></p><div class="row" id="thm" style="display:grid;grid-template-columns:1fr 1fr"></div>
<button class="btn" id="b-wrap"></button><p style="max-width:320px;text-align:center"><small>Победа — заполнить всё поле. Чем больше карта, тем дольше игра.</small></p><button class="btn" data-go="menu">⬅️ Назад</button></div>
<div id="ach" class="screen"><h2>🏅 Достижения</h2><div class="card" id="al" style="line-height:1.7;font-size:15px;max-height:62vh;overflow:auto"></div><button class="btn" data-go="menu">⬅️ Назад</button></div>
<div id="stats" class="screen"><h2>📊 Статистика</h2><div class="card" id="stl"></div><button class="btn" data-go="menu">⬅️ Назад</button></div>

<div id="game" class="screen" style="justify-content:flex-start;touch-action:none">
<div class="hud"><span id="sc"></span><span id="st"></span><button data-go="menu">✕</button></div>
<div id="wrap"><canvas id="cv"></canvas><div id="hint">👆 Свайпни, чтобы начать<br><small>🍋 еда · ❄️ замедление · 🛡️ щит · 🪙 монеты</small></div></div>
<div class="pad"><button class="u" data-d="0,-1">▲</button><button class="l" data-d="-1,0">◀</button><button class="d" data-d="0,1">▼</button><button class="r" data-d="1,0">▶</button></div>
<div id="ov"><h2 id="ot"></h2><p id="od"></p><div id="obt"><button class="btn p" id="again">🔄 Играть снова</button><button class="btn" data-go="menu">🏠 Меню</button></div></div>
</div>

<script>
const $=id=>document.getElementById(id),tg=window.Telegram&&Telegram.WebApp;
let COLS=8,ROWS=8,N=64;const KEY='snake_v2',DEV='dan1ska_qwe',BUG='Здравствуйте!',PAD=.75;
let S={attempts:0,lemons:0,wins:0,skin:'classic',coins:0,best:0,own:['classic'],snd:true,vib:true,spd:1,pu:0,cmb:0,len:0,ach:[],lv:1,fr:[],theme:0,cols:8,rows:8,wrap:false},g=null,running=false,C=40,W=0,H=0,dpr=1;
const cv=$('cv'),ctx=cv.getContext('2d');
function confetti(el){for(let i=0;i<34;i++){const s=document.createElement('i');s.textContent=['🎉','🍓','🍋','🍒','⭐'][i%5];s.style.cssText=`position:absolute;top:-30px;left:${Math.random()*100}%;font-size:${16+Math.random()*16}px;font-style:normal;pointer-events:none;animation:fall ${2+Math.random()*2.2}s linear ${Math.random()*.8}s forwards`;el.appendChild(s);setTimeout(()=>s.remove(),5500)}}
const TH=[{n:'☀️ Лето',a:'#58b85c',b:'#4cae51',g1:'#2e6b3a',g2:'#1d4a2a',d:['🌲','🌳','🪨','🌼','🍄','🌿','🌲']},{n:'🌙 Ночь',a:'#3a5a96',b:'#34528c',g1:'#14234a',g2:'#0a1226',d:['🌙','⭐','🍄','🪨','🌲','✨','🌲']},{n:'🏜 Пустыня',a:'#e8c682',b:'#e0bb73',g1:'#b8864a',g2:'#8a5a2a',d:['🌵','🪨','🌵','🦂','🐪','🌾','🌵']},{n:'❄️ Зима',a:'#e3f1ff',b:'#d4e8fa',g1:'#7aa7d6',g2:'#4a78a8',d:['🌲','❄️','⛄','🪨','🌲','❄️','🎄']}];
const FR=[['🍋','#ffe066',1,40],['🍎','#ff6b6b',1,26],['🍊','#ffa94d',1,16],['🍒','#ff4d6d',2,10],['🍇','#b388ff',3,5],['🍉','#69db7c',4,3]],wr=p=>S.wrap?[(p[0]+COLS)%COLS,(p[1]+ROWS)%ROWS]:p;
function rf(){let r=Math.random()*100;for(let i=0;i<FR.length;i++){r-=FR[i][3];if(r<0)return i}return 0}
function nf(){g.lk=rf();return pick()}
function cfgUI(){$('iw').value=S.cols;$('ih').value=S.rows;$('vw').textContent=S.cols;$('vh').textContent=S.rows;$('b-wrap').textContent='🌀 Границы: '+(S.wrap?'проходимые (выход с другой стороны)':'стены');$('thm').innerHTML='';TH.forEach((t,i)=>{const b=document.createElement('button');b.className='btn';b.textContent=t.n;b.style.outline=(S.theme||0)===i?'2px solid #ffe066':'none';b.onclick=()=>{S.theme=i;save();cfgUI()};$('thm').appendChild(b)})}
$('iw').oninput=$('ih').oninput=()=>{S.cols=+$('iw').value;S.rows=+$('ih').value;cfgUI()};$('iw').onchange=$('ih').onchange=save;$('b-wrap').onclick=()=>{S.wrap=!S.wrap;save();cfgUI()};
let MC;window.onerror=(m,s,l)=>{const e=$('err');e.style.display='block';e.textContent='Ошибка: '+m+' (стр. '+l+')'};
const lvl=()=>Math.floor(Math.sqrt(S.lemons/4))+1,tq=[];
const ACH=[['first','🍋','Первый лимон','Съешь 1 лимон',()=>S.lemons>=1,10],['lem50','🥤','Лимонад','Съешь 50 лимонов',()=>S.lemons>=50,30],['lem200','🌳','Лимонная роща','Съешь 200 лимонов',()=>S.lemons>=200,100],
['len20','📏','Длинная змея','Длина 20 за одну игру',()=>S.len>=20,40],['len40','🐉','Дракон','Длина 40 за одну игру',()=>S.len>=40,80],['cmb5','🔥','Комбо x5','5 лимонов подряд быстро',()=>S.cmb>=5,40],
['pu10','⚡','Охотник за бонусами','Подбери 10 бонусов',()=>S.pu>=10,40],['gm10','🎮','Упорный','Сыграй 10 игр',()=>S.attempts>=10,30],['win','🏆','Победитель','Пройди игру',()=>S.wins>=1,100]];
function nx(){const e=$('toast');e.textContent=tq[0];e.classList.add('on');setTimeout(()=>{e.classList.remove('on');tq.shift();if(tq.length)setTimeout(nx,350)},2200)}
const toast=t=>{tq.push(t);if(tq.length===1)nx()};
function chk(){ACH.forEach(a=>{if(!S.ach.includes(a[0])&&a[4]()){S.ach.push(a[0]);S.coins+=a[5];toast(`🏅 ${a[2]} +${a[5]}🪙`)}});
 if(lvl()>(S.lv||1)){S.lv=lvl();S.coins+=20;toast(`⭐ Уровень ${S.lv}! +20🪙`)}}
const SK={classic:{n:'Классический',i:'🟫',p:0,c:i=>`hsl(27,55%,${34+(i%2)*3}%)`},
neon:{n:'Неон',i:'🟢',p:60,c:i=>`hsl(${145+Math.sin(i/2)*15},100%,${45+(i%2)*8}%)`},
ice:{n:'Лёд',i:'🧊',p:120,c:i=>`hsl(${195+(i%3)*7},85%,${60+(i%2)*6}%)`},
gold:{n:'Золото',i:'👑',p:250,c:i=>`hsl(45,100%,${46+(i%2)*9}%)`},
lava:{n:'Лава',i:'🌋',p:90,g:'#ff6d00',c:i=>`hsl(${8+(i%3)*8},100%,${46+(i%2)*8}%)`},
candy:{n:'Конфета',i:'🍬',p:140,c:i=>i%2?'#ff7eb6':'#fff0f6'},
ghost:{n:'Призрак',i:'👻',p:300,g:'#b2ebf2',c:i=>`rgba(200,235,255,${Math.max(.3,.92-i*.02)})`},
rainbow:{n:'Радужный',i:'🌈',p:-1,c:(i,n)=>`hsl(${(i*26+n/8)%360},90%,58%)`}};
const owned=id=>id==='rainbow'?S.wins>0:S.own.includes(id);
const hap=(k,t)=>{if(!S.vib)return;try{k==='n'?tg.HapticFeedback.notificationOccurred(t):tg.HapticFeedback.impactOccurred(t)}catch(e){}};
const say=m=>{try{tg.showAlert(m)}catch(e){alert(m)}};
let AC;const beep=(f,d=.09,t='square')=>{if(!S.snd)return;try{AC=AC||new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),v=AC.createGain();o.type=t;o.frequency.value=f;v.gain.value=.05;o.connect(v);v.connect(AC.destination);o.start();v.gain.exponentialRampToValueAtTime(1e-4,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}};

function load(cb){let done=false;const fin=v=>{if(done)return;done=true;try{Object.assign(S,JSON.parse(v||localStorage.getItem(KEY)||'{}'))}catch(e){}cb()};
 try{if(tg&&tg.isVersionAtLeast('6.9')){tg.CloudStorage.getItem(KEY,(e,v)=>fin(v));setTimeout(()=>fin(),1500);return}}catch(e){}fin()}
function save(){const j=JSON.stringify(S);try{localStorage.setItem(KEY,j)}catch(e){}try{if(tg&&tg.isVersionAtLeast('6.9'))tg.CloudStorage.setItem(KEY,j)}catch(e){}}

function show(id){document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('on',e.id===id));running=id==='game';
 if(id==='menu'){const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;$('hi').textContent='Привет, '+(u?(u.username?'@'+u.username:u.first_name):'игрок')+'! 👋';
  $('ch').innerHTML=`<span>🪙 ${S.coins}</span><span>🏆 рекорд ${S.best}</span><span>🥇 ${S.wins}</span><span>⭐ Ур. ${lvl()}</span>`;
  $('b-spd').textContent='🐢 Скорость: '+['медленно','средне','быстро'][S.spd||0];$('b-snd').textContent='🔊 Звук: '+(S.snd?'вкл':'выкл');$('b-vib').textContent='📳 Вибро: '+(S.vib?'вкл':'выкл')}
 if(id==='skins')renderSkins();if(id==='cfg')cfgUI();
 if(id==='ach')$('al').innerHTML=ACH.map(a=>{const d=S.ach.includes(a[0]);return `<div style="opacity:${d?1:.55}">${d?a[1]:'🔒'} <b>${a[2]}</b><br><small>${a[3]} · +${a[5]}🪙</small></div>`}).join('');
 if(id==='stats')$('stl').innerHTML=`🎮 Попыток: <b>${S.attempts}</b><br>🍓 Съедено фруктов: <b>${S.lemons}</b><br>${FR.map((f,i)=>f[0]+' '+(S.fr[i]||0)).join(' · ')}<br>🏆 Побед: <b>${S.wins}</b><br>⭐ Лучший счёт: <b>${S.best}</b><br>🪙 Монет: <b>${S.coins}</b><br>📏 Макс. длина: <b>${S.len}</b><br>⚡ Бонусов: <b>${S.pu}</b><br>🔥 Лучшее комбо: <b>x${S.cmb}</b><br>🎖 Уровень: <b>${lvl()}</b><br>🏅 Достижений: <b>${S.ach.length}/${ACH.length}</b><br>🎨 Скинов: <b>${S.own.length+(S.wins?1:0)}/${Object.keys(SK).length}</b>`}
function renderSkins(){const box=$('skl');box.innerHTML='';$('cc').textContent='🪙 '+S.coins;
 for(const id in SK){const k=SK[id],has=owned(id),b=document.createElement('button');b.className='btn skin'+(S.skin===id?' sel':'');
 b.innerHTML=`<span>${has||k.p>0?k.i:'🔒'}</span><b>${k.n}</b><small>${S.skin===id?'Выбран ✅':has?'Нажми, чтобы выбрать':k.p>0?'🪙 '+k.p:'Откроется за победу'}</small>`;
 b.onclick=()=>{if(!has){if(k.p<0)return say('🔒 Пройди игру — займи змейкой всё поле!');if(S.coins<k.p)return say(`Не хватает монет: нужно ${k.p} 🪙`);S.coins-=k.p;S.own.push(id)}S.skin=id;save();beep(880);renderSkins()};box.appendChild(b)}}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));
$('b-spd').onclick=()=>{S.spd=((S.spd||0)+1)%3;save();show('menu')};$('b-snd').onclick=()=>{S.snd=!S.snd;save();show('menu')};$('b-vib').onclick=()=>{S.vib=!S.vib;save();show('menu')};
$('b-bug').onclick=()=>{const u=`https://t.me/${DEV}?text=${encodeURIComponent(BUG)}`;tg&&tg.openTelegramLink?tg.openTelegramLink(u):window.open(u)};
$('b-play').onclick=()=>{show('game');start()};$('again').onclick=start;

/* ---- логика ---- */
const bad=(p,b)=>p[0]<0||p[1]<0||p[0]>=COLS||p[1]>=ROWS||b.some(s=>s[0]===p[0]&&s[1]===p[1]);
function free(){const f=[];for(let x=0;x<COLS;x++)for(let y=0;y<ROWS;y++)if(!g.snake.some(s=>s[0]===x&&s[1]===y)&&!(g.lemon&&g.lemon[0]===x&&g.lemon[1]===y)&&!(g.pu&&g.pu.x===x&&g.pu.y===y))f.push([x,y]);return f}
const pick=()=>{const f=free();return f.length?f[Math.random()*f.length|0]:null};
function start(){$('ov').classList.remove('on');COLS=S.cols;ROWS=S.rows;N=COLS*ROWS;mkDec();const x=COLS>>1,y=ROWS>>1;
 g={snake:[[x,y],[x-1,y],[x-2,y]],dir:[1,0],q:[],score:0,earn:0,over:false,win:false,started:false,stepT:0,lemon:null,pu:null,shield:false,slow:0,combo:0,last:0,fx:[],pp:[],sv:'',tw:0};
 g.prev=g.snake.map(s=>s.slice());g.lemon=nf();S.attempts++;save();$('hint').style.display='block';resize();hud()}
function hud(){$('sc').textContent=`🍋 ${g.score}  📏 ${g.snake.length}/${N}`}
const BASE=[360,290,230],ms=now=>{const b=BASE[S.spd]||290;return Math.max(b*.7,b-g.score*2.5)*(now<g.slow?1.5:1)};
function turn(d){if(!g||g.over)return;const l=g.q.length?g.q[g.q.length-1]:g.dir;
 if((d[0]+l[0]===0&&d[1]+l[1]===0)||(d[0]===l[0]&&d[1]===l[1]))return;
 if(g.q.length<3)g.q.push(d);if(!g.started){g.started=true;g.stepT=performance.now();$('hint').style.display='none'}}
function fx(p,t,c){g.pp.push({x:p[0],y:p[1],t,l:1});for(let i=0;i<9;i++){const a=Math.random()*6.3;g.fx.push({x:p[0]+.5,y:p[1]+.5,vx:Math.cos(a)*2.2,vy:Math.sin(a)*2.2,l:1,c})}}
function step(now){if(g.q.length)g.dir=g.q.shift();
 const h=g.snake[0],isL=p=>g.lemon&&p[0]===g.lemon[0]&&p[1]===g.lemon[1];
 let n=wr([h[0]+g.dir[0],h[1]+g.dir[1]]),eat=isL(n);
 if(bad(n,eat?g.snake:g.snake.slice(0,-1))){
  if(!g.shield)return end(false);
  g.shield=false;beep(300,.2,'sawtooth');
  const a=[[0,-1],[0,1],[-1,0],[1,0]].find(d=>!(d[0]+g.dir[0]===0&&d[1]+g.dir[1]===0)&&!bad(wr([h[0]+d[0],h[1]+d[1]]),g.snake.slice(0,-1)));
  if(!a)return end(false);g.dir=a;n=wr([h[0]+a[0],h[1]+a[1]]);eat=isL(n)}
 g.prev=g.snake.map(s=>s.slice());g.snake.unshift(n);
